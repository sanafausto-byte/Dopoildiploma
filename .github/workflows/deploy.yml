name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set D1 database ID
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const placeholder = '00000000-0000-4000-8000-000000000000';
          const databaseId = process.env.CF_D1_DATABASE_ID;
          if (!databaseId) throw new Error('Missing GitHub Actions secret CF_D1_DATABASE_ID');
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(placeholder)) throw new Error('D1 placeholder was not found in wrangler.jsonc');
          fs.writeFileSync(path, source.replace(placeholder, databaseId));
          NODE

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Worker
        run: pnpm build

      - name: Deploy Worker
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
